name: pokekool-dev

# Stack de développement local complète, conteneurisée.
# Lancée depuis la racine du repo :
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Services & ports :
#   Web (nginx + Angular) : 8090   ← point d'entrée navigateur
#   API (.NET + Blender)   : 5080
#   PostgreSQL (+pgvector) : 5434
#   Redis                  : 6382
#   Ollama (LLM/vision)    : 11434
#   Card Embedding (DINOv2): 8500
#   Adminer                : 8091
#
# NB Ollama : les modèles ne sont pas embarqués. Après le premier démarrage :
#   docker exec -it pokekool-ollama ollama pull qwen2.5:7b
#   docker exec -it pokekool-ollama ollama pull llava:7b
#
# NB Card Embedding : DINOv2 (Meta, licence Apache 2.0) est téléchargé au premier
# démarrage via torch.hub et mis en cache dans le volume card-embedding-cache.
# Sert le matching visuel de cartes en complément (comparatif) du LLM vision Ollama —
# voir 03-Metier/Automatisations-LLM.md § Matching visuel (DINOv2).

services:

  postgres:
    # Image pgvector/pgvector : Postgres 16 + extension pgvector préinstallée
    # (CREATE EXTENSION vector activée par la migration EF dédiée, pas ici).
    image: pgvector/pgvector:pg16
    container_name: pokekool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokekool}
      POSTGRES_USER: ${POSTGRES_USER:-pokekool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokekool_dev_password}
      # PGDATA custom retiré (2026-09-07) : provoquait "mkdir: Permission denied" sur
      # /var/lib/postgresql/data/pgdata avec pgvector/pgvector:pg16 sous Docker Desktop
      # Windows — l'entrypoint de cette image ne chown pas toujours correctement le
      # sous-dossier PGDATA sur un volume nommé fraîchement créé. On laisse Postgres
      # utiliser directement la racine du volume monté (comportement par défaut, plus robuste).
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokekool} -d ${POSTGRES_DB:-pokekool}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pokekool-net

  redis:
    image: redis:7-alpine
    container_name: pokekool-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pokekool-net

  ollama:
    image: ollama/ollama:latest
    container_name: pokekool-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - pokekool-net
    # GPU (optionnel, décommenter si NVIDIA + nvidia-container-toolkit dispo) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  card-embedding:
    build:
      context: ../services/card-embedding
      dockerfile: Dockerfile
    container_name: pokekool-card-embedding
    restart: unless-stopped
    ports:
      - "${CARD_EMBEDDING_PORT:-8500}:8500"
    volumes:
      # Cache des poids DINOv2 téléchargés via torch.hub — évite un re-téléchargement
      # à chaque rebuild/redémarrage du container.
      - card-embedding-cache:/root/.cache/torch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pokekool-net
    # GPU (optionnel, décommenter si NVIDIA + nvidia-container-toolkit dispo) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build:
      context: ..
      dockerfile: src/backend/Dockerfile
    container_name: pokekool-api
    restart: unless-stopped
    environment:
      # Development => Swagger + migrations EF + seed appliqués au démarrage.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Les variables __ (double underscore) surchargent appsettings.*.json.
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-pokekool};Username=${POSTGRES_USER:-pokekool};Password=${POSTGRES_PASSWORD:-pokekool_dev_password}"
      Redis__ConnectionString: "redis:6379"
      Ollama__BaseUrl: "http://ollama:11434"
      OllamaVision__BaseUrl: "http://ollama:11434"
      OllamaChat__BaseUrl: "http://ollama:11434"
      CardEmbedding__BaseUrl: "http://card-embedding:8500"
      Blender__ExecutablePath: "blender"
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      # Persistance des .glb compilés et des .blend uploadés
      - api-models:/app/wwwroot/models
      - api-uploads:/app/App_Data/blender-uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      card-embedding:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - pokekool-net

  web:
    build:
      context: ../src/web/poke-web
      dockerfile: Dockerfile
    container_name: pokekool-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pokekool-net

  adminer:
    image: adminer:4
    container_name: pokekool-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8091}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pokekool-net

volumes:
  postgres-data:
    name: pokekool-postgres-data
  redis-data:
    name: pokekool-redis-data
  ollama-data:
    name: pokekool-ollama-data
  card-embedding-cache:
    name: pokekool-card-embedding-cache
  api-models:
    name: pokekool-api-models
  api-uploads:
    name: pokekool-api-uploads

networks:
  pokekool-net:
    name: pokekool-net
    driver: bridge
