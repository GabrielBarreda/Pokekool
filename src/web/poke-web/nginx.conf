# Sert le SPA Angular et proxifie l'API sur la même origine (pas de CORS).
# Le service API est joignable sous le nom DNS "api" dans le réseau docker-compose.

upstream pokekool_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques + fallback SPA (routing Angular côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST
    location /api/ {
        proxy_pass http://pokekool_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads .blend potentiellement volumineux
        client_max_body_size 200m;
    }

    # Modèles 3D (.glb) servis par l'API (module Stockage Physique).
    # ^~ : priorité sur les locations regex ci-dessous (sinon .glb serait cherché en local).
    location ^~ /models/ {
        proxy_pass http://pokekool_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache long pour les assets buildés localement (hash dans le nom de fichier)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
