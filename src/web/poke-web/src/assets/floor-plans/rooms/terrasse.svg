<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <defs>${STONE_PATTERN}</defs>
    <rect width="400" height="300" fill="url(#ph-stone)"/>
    <!-- Bac plantes gauche -->
    <rect x="10" y="10" width="20" height="280" rx="3" fill="#6a8a5a" opacity="0.6"/>
    <!-- Bac plantes droite -->
    <rect x="370" y="10" width="20" height="280" rx="3" fill="#6a8a5a" opacity="0.6"/>
    <!-- Parasol 1 -->
    <circle cx="130" cy="100" r="45" fill="#e8e0d0" opacity="0.7"/>
    <line x1="130" y1="55" x2="130" y2="145" stroke="#b0a090" stroke-width="2"/>
    ${roundTable(130, 110, 14, 4, '#7a6a5a', '#8b7b6b')}
    <!-- Parasol 2 -->
    <circle cx="290" cy="100" r="45" fill="#e8e0d0" opacity="0.7"/>
    <line x1="290" y1="55" x2="290" y2="145" stroke="#b0a090" stroke-width="2"/>
    ${roundTable(290, 110, 14, 4, '#7a6a5a', '#8b7b6b')}
    <!-- Tables sans parasol -->
    ${rectTable(130, 230, 45, 30, 4, '#7a6a5a', '#8b7b6b')}
    ${rectTable(290, 230, 45, 30, 4, '#7a6a5a', '#8b7b6b')}
    <!-- Bac plantes petits -->
    <rect x="50" y="270" width="30" height="20" rx="4" fill="#6a8a5a" opacity="0.5"/>
    <rect x="320" y="270" width="30" height="20" rx="4" fill="#6a8a5a" opacity="0.5"/>
  </svg>