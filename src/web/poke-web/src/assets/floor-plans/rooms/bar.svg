<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="300" fill="#3d2415"/>
    <rect width="400" height="300" fill="#2a1a0e" opacity="0.3"/>
    <!-- Comptoir en L -->
    <rect x="40" y="60" width="200" height="30" rx="4" fill="#5a3a1a" stroke="#c9a84c" stroke-width="1.5"/>
    <rect x="220" y="60" width="30" height="140" rx="4" fill="#5a3a1a" stroke="#c9a84c" stroke-width="1.5"/>
    <!-- Tabourets comptoir horizontal -->
    <circle cx="70" cy="110" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <circle cx="105" cy="110" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <circle cx="140" cy="110" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <circle cx="175" cy="110" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <circle cx="210" cy="110" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <!-- Tabourets comptoir vertical -->
    <circle cx="270" cy="110" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <circle cx="270" cy="145" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <circle cx="270" cy="180" r="8" fill="#7a4a1e" stroke="#5a3a1a" stroke-width="1"/>
    <!-- Arrière-bar : étagères -->
    <rect x="60" y="20" width="12" height="35" rx="1" fill="#4a3020"/>
    <rect x="85" y="20" width="12" height="35" rx="1" fill="#4a3020"/>
    <rect x="110" y="20" width="12" height="35" rx="1" fill="#4a3020"/>
    <rect x="135" y="20" width="12" height="35" rx="1" fill="#4a3020"/>
    <!-- Table basse -->
    ${roundTable(120, 230, 16, 4, '#5a3a1a', '#7a4a1e')}
    ${roundTable(300, 230, 16, 4, '#5a3a1a', '#7a4a1e')}
  </svg>