    <rect x="62" y="120" width="26" height="80" rx="1" fill="#ccc8c2" stroke="#b0aca6" stroke-width="0.5"/>
    <rect x="152" y="120" width="26" height="80" rx="1" fill="#ccc8c2" stroke="#b0aca6" stroke-width="0.5"/>
    <rect x="242" y="120" width="26" height="80" rx="1" fill="#ccc8c2" stroke="#b0aca6" stroke-width="0.5"/>
